name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check source and behavior
        run: |
          node tools/check-source.cjs
          node tools/test.cjs
          for file in package/luci-app-device-traffic/files/usr/bin/* package/luci-app-device-traffic/files/etc/init.d/*; do
            sh -n "$file"
          done
      - name: Build unsigned OpenWrt APK
        run: sh build-apk.sh
      - name: Create checksums
        run: sha256sum luci-app-device-traffic-*.apk > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: luci-app-device-traffic-apk
          path: |
            luci-app-device-traffic-*.apk
            SHA256SUMS
          if-no-files-found: error
